<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>오름</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="오름" />
<meta name="theme-color" content="#000000" />
<script>
  // apply the saved theme before first paint (and pick a readable iOS status bar for light mode)
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem("wt_settings") || "{}");
      var pref = s.theme || "auto";
      var t = pref === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pref;
      document.documentElement.dataset.theme = t;
      if (t === "light") {
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", "default");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f2f2f7");
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy@d73efc3cd471a7faf198f39b1783b14da13dd7c4/Paperlogy.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
